<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>Agendamento — Serviços &amp; Horários</title>
  <link rel="stylesheet" href="assets/css/tailwind.css" />
  <script src="assets/js/state.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/bk.js"></script>
  <script src="assets/js/query.js"></script>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/i18n.js"></script>
</head>
<body data-shell="public">
  <div id="app"><div id="page"></div></div>

  <script>
    const VALUES = ['value1', 'value2', 'value3'];
    const VALUE_ICONS = { value1: 'star', value2: 'zap', value3: 'shield-check' };

    window.renderPage = function () {
      const t = UI.t, icon = UI.icon, img = Data.serviceImage;
      const pros = Bk.get().professionals.filter((p) => p.active);

      const stats = [
        { value: '10+', key: 'statsYears' },
        { value: '12k+', key: 'statsBookings' },
        { value: String(pros.length), key: 'statsPros' },
        { value: '4.9', key: 'statsRating' },
      ];

      const hero =
        '<section class="relative overflow-hidden border-b border-themed"><div class="absolute inset-0 -z-10"><img src="' + img('about-hero', 1600, 700) + '" alt="" class="h-full w-full object-cover"/><div class="absolute inset-0 bg-gradient-to-b from-gray-950/70 to-gray-950/80"></div></div>' +
        '<div class="mx-auto max-w-7xl px-4 py-20 text-center sm:px-6 lg:px-8"><h1 class="text-3xl font-bold text-white sm:text-4xl">' + t('about.title') + '</h1><p class="mx-auto mt-3 max-w-xl text-gray-200">' + t('about.subtitle') + '</p></div></section>';

      const mission =
        '<section class="mx-auto max-w-3xl px-4 py-16 text-center sm:px-6 lg:px-8"><h2 class="text-2xl font-bold text-heading">' + t('about.missionTitle') + '</h2><p class="mt-4 text-muted">' + t('about.missionText') + '</p></section>';

      const statsSection =
        '<section class="surface-card border-y border-themed"><div class="mx-auto grid max-w-7xl grid-cols-2 gap-6 px-4 py-10 sm:px-6 lg:grid-cols-4 lg:px-8">' +
        stats.map((s) => '<div class="text-center"><p class="text-3xl font-bold text-brand-600 dark:text-brand-400">' + s.value + '</p><p class="mt-1 text-sm text-muted">' + t('about.' + s.key) + '</p></div>').join('') + '</div></section>';

      const values =
        '<section class="mx-auto max-w-7xl px-4 py-16 sm:px-6 lg:px-8"><h2 class="text-center text-2xl font-bold text-heading">' + t('about.valuesTitle') + '</h2>' +
        '<div class="mt-10 grid gap-6 md:grid-cols-3">' + VALUES.map((v) =>
          '<div class="rounded-2xl border border-themed p-6 text-center"><span class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-brand-50 text-brand-500 dark:bg-brand-500/15">' + icon(VALUE_ICONS[v], { size: 26 }) + '</span>' +
          '<h3 class="mt-4 font-semibold text-heading">' + t('about.' + v + 'Title') + '</h3><p class="mt-2 text-sm text-muted">' + t('about.' + v + 'Text') + '</p></div>'
        ).join('') + '</div></section>';

      const team =
        '<section class="surface-card border-y border-themed"><div class="mx-auto max-w-7xl px-4 py-16 sm:px-6 lg:px-8"><div class="text-center"><h2 class="text-2xl font-bold text-heading">' + t('about.teamTitle') + '</h2><p class="mt-2 text-muted">' + t('about.teamSubtitle') + '</p></div>' +
        '<div class="mt-8 grid gap-6 sm:grid-cols-2 lg:grid-cols-4">' + pros.map((p) => UI.professionalCard(p)).join('') + '</div></div></section>';

      document.getElementById('tx-main').innerHTML = hero + mission + statsSection + values + team;
    };
  </script>
  <script src="assets/js/layout.js"></script>
</body>
</html>
