<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>Agendamento — Serviços &amp; Horários</title>
  <link rel="stylesheet" href="assets/css/tailwind.css" />
  <script src="assets/js/state.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/bk.js"></script>
  <script src="assets/js/query.js"></script>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/i18n.js"></script>
</head>
<body data-shell="public">
  <div id="app"><div id="page"></div></div>

  <script>
    const STEP_KEYS = ['booking.steps.service', 'booking.steps.professional', 'booking.steps.datetime', 'booking.steps.details', 'booking.steps.confirm'];
    // Month cursor for the calendar (separate from selected date).
    let calCursor = null;
    let deepLinkApplied = false;

    function eligiblePros() {
      const st = Bk.get();
      const b = Bk.Booking.get();
      const svc = Query.serviceById(st.services, b.serviceId);
      return svc ? Query.professionalsForService(st.professionals, svc.id) : [];
    }
    function effectivePro() {
      const st = Bk.get();
      const b = Bk.Booking.get();
      if (b.professionalId != null) return Query.professionalById(st.professionals, b.professionalId) || null;
      return eligiblePros()[0] || null;
    }
    function currentService() {
      return Query.serviceById(Bk.get().services, Bk.Booking.get().serviceId) || null;
    }
    function currentSlots() {
      const b = Bk.Booking.get();
      const svc = currentService();
      const pro = effectivePro();
      if (!svc || !pro || !b.date) return [];
      return Query.generateSlots(pro, svc, b.date, Bk.get().appointments);
    }
    function canNext() {
      const b = Bk.Booking.get();
      if (b.step === 0) return b.serviceId != null;
      if (b.step === 1) return true;
      if (b.step === 2) return b.date != null && b.time != null;
      if (b.step === 3) return b.contact.name && /.+@.+\..+/.test(b.contact.email) && b.contact.phone;
      return true;
    }

    function summaryRow(label, value) {
      const t = UI.t;
      return '<div class="flex items-center justify-between gap-3"><dt class="text-muted">' + label + '</dt><dd class="text-right font-medium ' + (value ? 'text-heading' : 'text-muted') + '">' + (value || t('booking.notSelected')) + '</dd></div>';
    }

    function handleConfirm() {
      const t = UI.t;
      const b = Bk.Booking.get();
      const svc = currentService();
      const pro = effectivePro();
      if (!svc || !pro || !b.date || !b.time) return;
      const client = Bk.addClient({ name: b.contact.name, email: b.contact.email, phone: b.contact.phone, notes: b.contact.notes });
      const parts = b.time.split(':').map(Number);
      const dt = new Date(b.date);
      dt.setHours(parts[0], parts[1], 0, 0);
      Bk.createAppointment({
        serviceId: svc.id, professionalId: pro.id, clientId: client.id,
        datetime: dt.toISOString(), duration: svc.duration, price: svc.price, status: 'pendente', notes: b.contact.notes,
      });
      UI.notify(t('booking.created'), 'success');
      Bk.Booking.next();
    }

    window.renderPage = function () {
      const t = UI.t, icon = UI.icon;
      const st = Bk.get();
      const b = Bk.Booking.get();

      // Deep-link: ?servico=<slug> preselects the service and jumps to step 1.
      if (!deepLinkApplied) {
        deepLinkApplied = true;
        const slug = new URLSearchParams(window.location.search).get('servico');
        if (slug) {
          const svc = Query.serviceBySlug(st.services, slug);
          if (svc && svc.id !== b.serviceId) { Bk.Booking.setService(svc.id); Bk.Booking.setStep(1); return; }
        }
      }

      const svc = currentService();
      const pro = effectivePro();
      const inputCls = 'h-11 w-full rounded-lg border border-themed bg-card-bg px-3.5 text-sm text-body focus-ring surface-card placeholder:text-muted';

      let main = '';

      // Step 0 — service
      if (b.step === 0) {
        main = '<div><h2 class="mb-5 text-lg font-semibold text-heading">' + t('booking.chooseService') + '</h2><div class="grid gap-5 sm:grid-cols-2">' +
          st.services.filter((s) => s.active).map((s) =>
            '<button type="button" data-pick-service="' + s.id + '" class="surface-card flex items-center gap-4 rounded-2xl border p-4 text-left transition hover:border-brand-300 ' + (b.serviceId === s.id ? 'border-brand-500 ring-1 ring-brand-500' : '') + '">' +
            '<img src="' + s.photo + '" alt="" class="h-16 w-16 shrink-0 rounded-xl object-cover"/><div class="min-w-0 flex-1"><p class="truncate font-semibold text-heading">' + s.name + '</p>' +
            '<p class="mt-0.5 flex items-center gap-1.5 text-xs text-muted">' + icon('clock', { size: 13 }) + ' ' + s.duration + ' ' + t('common.minutes') + '</p>' +
            '<p class="mt-1 text-sm font-semibold text-brand-600 dark:text-brand-400">' + UI.fmt(s.price) + '</p></div></button>'
          ).join('') + '</div></div>';
      }

      // Step 1 — professional
      if (b.step === 1 && svc) {
        const anyCard =
          '<button type="button" data-pick-any class="surface-card flex items-center gap-4 rounded-2xl border p-4 text-left transition hover:border-brand-300 ' + (b.professionalId === null ? 'border-brand-500 ring-1 ring-brand-500' : '') + '">' +
          '<span class="flex h-14 w-14 shrink-0 items-center justify-center rounded-full bg-brand-50 text-brand-500 dark:bg-brand-500/15">' + icon('users', { size: 24 }) + '</span>' +
          '<div class="min-w-0"><p class="font-semibold text-heading">' + t('booking.anyProfessional') + '</p><p class="text-sm text-muted">' + t('booking.anyProfessionalDesc') + '</p></div></button>';
        main = '<div><h2 class="mb-5 text-lg font-semibold text-heading">' + t('booking.chooseProfessional') + '</h2><div class="grid gap-4 sm:grid-cols-2">' +
          anyCard + eligiblePros().map((p) => UI.professionalSelect(p, b.professionalId === p.id)).join('') + '</div></div>';
      }

      // Step 2 — date & time
      if (b.step === 2 && svc) {
        if (!calCursor) calCursor = b.date ? Query.dateFromYmd(b.date) : new Date();
        const calHtml = UI.calendarGrid({ value: b.date, cursor: new Date(calCursor.getFullYear(), calCursor.getMonth(), 1), minToday: true });
        const slotsHtml = b.date ? UI.timeSlotPicker(currentSlots(), b.time) : '<p class="py-10 text-center text-sm text-muted">' + t('booking.selectDateFirst') + '</p>';
        main = '<div class="grid gap-6 md:grid-cols-2">' +
          '<div class="surface-card rounded-2xl border p-5"><h2 class="mb-4 text-lg font-semibold text-heading">' + t('booking.chooseDate') + '</h2>' + calHtml + '</div>' +
          '<div class="surface-card rounded-2xl border p-5"><h2 class="mb-4 text-lg font-semibold text-heading">' + t('booking.chooseTime') + '</h2>' + slotsHtml + '</div></div>';
      }

      // Step 3 — details
      if (b.step === 3) {
        const c = b.contact;
        main = '<div class="surface-card max-w-xl rounded-2xl border p-6"><h2 class="mb-5 text-lg font-semibold text-heading">' + t('booking.yourDetails') + '</h2><div class="space-y-4">' +
          '<div><label class="mb-1.5 block text-sm font-medium text-heading">' + t('booking.name') + '</label><input data-field="name" value="' + c.name.replace(/"/g, '&quot;') + '" class="' + inputCls + '" placeholder="João Silva"/></div>' +
          '<div class="grid gap-4 sm:grid-cols-2"><div><label class="mb-1.5 block text-sm font-medium text-heading">' + t('booking.email') + '</label><input data-field="email" type="email" value="' + c.email.replace(/"/g, '&quot;') + '" class="' + inputCls + '" placeholder="joao@email.com"/></div>' +
          '<div><label class="mb-1.5 block text-sm font-medium text-heading">' + t('booking.phone') + '</label><input data-field="phone" value="' + c.phone.replace(/"/g, '&quot;') + '" class="' + inputCls + '" placeholder="+55 11 90000-0000"/></div></div>' +
          '<div><label class="mb-1.5 block text-sm font-medium text-heading">' + t('booking.notes') + '</label><textarea data-field="notes" rows="3" placeholder="' + t('booking.notesPlaceholder') + '" class="w-full rounded-lg border border-themed bg-card-bg px-3.5 py-2.5 text-sm text-body focus-ring surface-card placeholder:text-muted">' + c.notes + '</textarea></div>' +
          '</div></div>';
      }

      // Step 4 — success
      if (b.step === 4) {
        main = '<div class="surface-card mx-auto max-w-lg rounded-2xl border p-8 text-center"><span class="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl bg-success-50 text-success-500 dark:bg-success-500/15">' + icon('check-circle', { size: 32 }) + '</span>' +
          '<h2 class="mt-5 text-xl font-bold text-heading">' + t('booking.successTitle') + '</h2><p class="mt-2 text-sm text-muted">' + t('booking.successDesc') + '</p>' +
          '<div class="mt-6 rounded-xl border border-themed p-4 text-left text-sm">' +
          summaryRow(t('booking.summaryService'), svc ? svc.name : '') +
          summaryRow(t('booking.summaryProfessional'), pro ? pro.name : '') +
          summaryRow(t('booking.summaryDate'), b.date ? UI.fmtDate(b.date) : '') +
          summaryRow(t('booking.summaryTime'), b.time || '') +
          '</div>' +
          '<div class="mt-6 flex flex-col gap-3 sm:flex-row"><a href="meus-agendamentos.html" class="flex h-11 flex-1 items-center justify-center rounded-lg bg-brand-500 text-sm font-medium text-white transition hover:bg-brand-600">' + t('booking.viewMyBookings') + '</a>' +
          '<button type="button" data-book-another class="flex h-11 flex-1 items-center justify-center rounded-lg border border-themed text-sm font-medium text-body transition hover:bg-gray-50 dark:hover:bg-gray-800">' + t('booking.bookAnother') + '</button></div></div>';
      }

      // Navigation buttons (steps 0..3)
      let nav = '';
      if (b.step < 4) {
        const nextBtn = b.step === 3
          ? '<button type="button" data-confirm ' + (canNext() ? '' : 'disabled') + ' class="flex h-11 items-center gap-2 rounded-lg bg-brand-500 px-6 text-sm font-medium text-white transition hover:bg-brand-600 disabled:opacity-40">' + icon('check', { size: 16 }) + ' ' + t('booking.confirmButton') + '</button>'
          : '<button type="button" data-next ' + (canNext() ? '' : 'disabled') + ' class="flex h-11 items-center gap-2 rounded-lg bg-brand-500 px-6 text-sm font-medium text-white transition hover:bg-brand-600 disabled:opacity-40">' + t('common.continue') + ' ' + icon('arrow-right', { size: 16 }) + '</button>';
        nav = '<div class="mt-8 flex items-center justify-between">' +
          '<button type="button" data-back ' + (b.step === 0 ? 'disabled' : '') + ' class="flex h-11 items-center gap-2 rounded-lg border border-themed px-5 text-sm font-medium text-body transition hover:bg-gray-50 disabled:opacity-40 dark:hover:bg-gray-800">' + icon('arrow-left', { size: 16 }) + ' ' + t('common.back') + '</button>' +
          nextBtn + '</div>';
      }

      // Sidebar summary
      let aside = '';
      if (b.step < 4) {
        const proLabel = b.professionalId === null && b.step >= 1 ? t('booking.anyProfessional') : (pro ? pro.name : '');
        aside = '<aside class="lg:sticky lg:top-24 lg:h-fit"><div class="surface-card rounded-2xl border p-5"><h3 class="text-base font-semibold text-heading">' + t('booking.summary') + '</h3>' +
          '<dl class="mt-4 space-y-3 text-sm">' +
          summaryRow(t('booking.summaryService'), svc ? svc.name : '') +
          summaryRow(t('booking.summaryProfessional'), proLabel) +
          summaryRow(t('booking.summaryDate'), b.date ? UI.fmtDate(b.date) : '') +
          summaryRow(t('booking.summaryTime'), b.time || '') +
          (svc ? summaryRow(t('booking.summaryDuration'), svc.duration + ' ' + t('common.minutes')) : '') +
          '</dl>' +
          (svc ? '<div class="mt-4 flex items-center justify-between border-t border-themed pt-4"><span class="text-sm font-medium text-heading">' + t('booking.summaryTotal') + '</span><span class="text-lg font-bold text-brand-600 dark:text-brand-400">' + UI.fmt(svc.price) + '</span></div>' : '') +
          (pro ? '<div class="mt-4 flex items-center gap-2 border-t border-themed pt-4">' + UI.avatar({ src: pro.avatar, name: pro.name, size: 'sm' }) + '<div class="min-w-0"><p class="truncate text-sm font-medium text-heading">' + pro.name + '</p><p class="truncate text-xs text-muted">' + t('specialties.' + pro.specialty) + '</p></div></div>' : '') +
          '</div></aside>';
      }

      document.getElementById('tx-main').innerHTML =
        '<div class="mx-auto max-w-6xl px-4 py-10 sm:px-6 lg:px-8">' +
        '<div class="mb-8 text-center"><h1 class="text-2xl font-bold text-heading sm:text-3xl">' + t('booking.title') + '</h1><p class="mt-2 text-muted">' + t('booking.subtitle') + '</p></div>' +
        (b.step < 4 ? '<div class="mb-8">' + UI.stepIndicator(STEP_KEYS, b.step) + '</div>' : '') +
        '<div class="grid gap-8 lg:grid-cols-[1fr_320px]"><div class="min-w-0">' + main + nav + '</div>' + aside + '</div></div>';

      bindWizard();
    };

    function bindWizard() {
      const wrap = document.getElementById('tx-main');
      // Step indicator jumps.
      wrap.querySelectorAll('[data-goto-step]').forEach((el) => el.addEventListener('click', () => { Bk.Booking.setStep(Number(el.getAttribute('data-goto-step'))); window.renderPage(); }));
      // Service pick.
      wrap.querySelectorAll('[data-pick-service]').forEach((el) => el.addEventListener('click', () => { Bk.Booking.setService(Number(el.getAttribute('data-pick-service'))); Bk.Booking.next(); window.renderPage(); }));
      // Professional pick.
      const anyBtn = wrap.querySelector('[data-pick-any]');
      if (anyBtn) anyBtn.addEventListener('click', () => { Bk.Booking.setProfessional(null); window.renderPage(); });
      wrap.querySelectorAll('[data-select-pro]').forEach((el) => el.addEventListener('click', () => { Bk.Booking.setProfessional(Number(el.getAttribute('data-select-pro'))); window.renderPage(); }));
      // Calendar.
      wrap.querySelectorAll('[data-cal-nav]').forEach((el) => el.addEventListener('click', () => {
        const dir = Number(el.getAttribute('data-cal-nav'));
        calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth() + dir, 1);
        window.renderPage();
      }));
      wrap.querySelectorAll('[data-cal-day]').forEach((el) => el.addEventListener('click', () => { Bk.Booking.setDate(el.getAttribute('data-cal-day')); window.renderPage(); }));
      // Slots.
      wrap.querySelectorAll('[data-slot]').forEach((el) => el.addEventListener('click', () => { Bk.Booking.setTime(el.getAttribute('data-slot')); window.renderPage(); }));
      // Detail fields (persist without re-render to keep focus; revalidate next button).
      wrap.querySelectorAll('[data-field]').forEach((el) => el.addEventListener('input', () => {
        const patch = {}; patch[el.getAttribute('data-field')] = el.value;
        Bk.Booking.setContact(patch);
        const btn = wrap.querySelector('[data-confirm]');
        if (btn) btn.disabled = !canNext();
      }));
      // Navigation.
      const back = wrap.querySelector('[data-back]');
      if (back) back.addEventListener('click', () => { Bk.Booking.back(); window.renderPage(); });
      const next = wrap.querySelector('[data-next]');
      if (next) next.addEventListener('click', () => { Bk.Booking.next(); window.renderPage(); });
      const confirm = wrap.querySelector('[data-confirm]');
      if (confirm) confirm.addEventListener('click', () => { handleConfirm(); window.renderPage(); });
      const another = wrap.querySelector('[data-book-another]');
      if (another) another.addEventListener('click', () => { Bk.Booking.reset(); calCursor = null; window.location.href = 'agendar.html'; });
    }
  </script>
  <script src="assets/js/layout.js"></script>
</body>
</html>
