<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>Agendamento — Serviços &amp; Horários</title>
  <link rel="stylesheet" href="assets/css/tailwind.css" />
  <script src="assets/js/state.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/bk.js"></script>
  <script src="assets/js/query.js"></script>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/i18n.js"></script>
</head>
<body data-shell="blank">
  <div id="app"><div id="page"></div></div>

  <script>
    let sent = false;

    function authShell(title, subtitle, inner, footer) {
      const icon = UI.icon, t = UI.t;
      return (
        '<div class="relative flex min-h-screen items-center justify-center bg-gradient-to-br from-brand-50 via-white to-brand-100 px-4 py-10 dark:from-gray-900 dark:via-gray-dark dark:to-gray-900">' +
        '<div class="absolute inset-0 -z-10 overflow-hidden"><div class="absolute -top-32 -right-32 h-96 w-96 rounded-full bg-brand-200/40 blur-3xl dark:bg-brand-500/10"></div><div class="absolute -bottom-32 -left-32 h-96 w-96 rounded-full bg-warning-100/60 blur-3xl dark:bg-brand-700/10"></div></div>' +
        '<div class="w-full max-w-md"><div class="mb-6 flex flex-col items-center"><a href="index.html" class="flex h-14 w-14 items-center justify-center rounded-2xl bg-brand-500 text-white shadow-theme-md">' + icon('calendar', { size: 26 }) + '</a><h1 class="mt-5 text-title-sm font-bold text-heading">' + title + '</h1><p class="mt-2 text-center text-sm text-muted">' + subtitle + '</p></div>' +
        '<div class="surface-card rounded-2xl border p-6 shadow-theme-md md:p-8">' + inner + '</div>' +
        (footer ? '<p class="mt-6 text-center text-sm text-muted">' + footer + '</p>' : '') +
        '<p class="mt-6 text-center text-xs text-muted"><a href="index.html" class="hover:text-brand-500">← ' + t('brand') + '</a></p></div></div>'
      );
    }

    window.renderPage = function () {
      const t = UI.t, icon = UI.icon;
      let inner;
      if (sent) {
        inner =
          '<div class="flex flex-col items-center py-4 text-center"><span class="flex h-14 w-14 items-center justify-center rounded-2xl bg-success-50 text-success-500 dark:bg-success-500/15">' + icon('check-circle', { size: 28 }) + '</span><p class="mt-4 text-sm text-body">' + t('auth.resetSent') + '</p></div>';
      } else {
        inner =
          '<form data-forgot class="space-y-5"><div><label class="mb-2 block text-sm font-medium text-heading">' + t('auth.email') + '</label><div class="relative"><span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">' + icon('mail', { size: 18 }) + '</span><input name="email" type="email" required placeholder="seu@email.com" class="h-11 w-full rounded-lg border border-themed bg-gray-50 pl-10 pr-3 text-sm text-body outline-none focus:border-brand-300 focus-ring dark:bg-gray-900"/></div></div>' +
          '<button type="submit" class="flex h-11 w-full items-center justify-center rounded-lg bg-brand-500 text-sm font-medium text-white transition hover:bg-brand-600 focus-ring">' + t('auth.sendLink') + '</button></form>';
      }
      const footer = '<a href="login.html" class="font-medium text-brand-500 hover:text-brand-600">← ' + t('auth.backToLogin') + '</a>';
      document.getElementById('page').innerHTML = authShell(t('auth.forgotTitle'), t('auth.forgotSubtitle'), inner, footer);

      const form = document.querySelector('[data-forgot]');
      if (form) form.addEventListener('submit', function (e) {
        e.preventDefault();
        sent = true;
        UI.notify(t('auth.resetSent'), 'success');
        window.renderPage();
      });
    };
  </script>
  <script src="assets/js/layout.js"></script>
</body>
</html>
