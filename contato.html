<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>Agendamento — Serviços &amp; Horários</title>
  <link rel="stylesheet" href="assets/css/tailwind.css" />
  <script src="assets/js/state.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/bk.js"></script>
  <script src="assets/js/query.js"></script>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/i18n.js"></script>
</head>
<body data-shell="public">
  <div id="app"><div id="page"></div></div>

  <script>
    const INFO = [
      { icon: 'map-pin', key: 'address' },
      { icon: 'phone', key: 'phone' },
      { icon: 'mail', key: 'email' },
      { icon: 'clock', key: 'hours' },
    ];

    window.renderPage = function () {
      const t = UI.t, icon = UI.icon, img = Data.serviceImage;
      const field = 'h-11 w-full rounded-lg border border-themed bg-card-bg px-3.5 text-sm text-body focus-ring surface-card';

      const info =
        '<div class="space-y-6"><div class="surface-card rounded-2xl border p-6"><h2 class="text-lg font-semibold text-heading">' + t('contact.infoTitle') + '</h2><ul class="mt-5 space-y-4">' +
        INFO.map((i) => '<li class="flex items-start gap-3"><span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-brand-50 text-brand-500 dark:bg-brand-500/15">' + icon(i.icon, { size: 18 }) + '</span><div><p class="text-sm font-medium text-heading">' + t('contact.' + i.key) + '</p><p class="text-sm text-muted">' + t('contact.' + i.key + 'Value') + '</p></div></li>').join('') +
        '</ul></div><div class="overflow-hidden rounded-2xl border border-themed"><img src="' + img('contact-map', 800, 400) + '" alt="" class="h-56 w-full object-cover"/></div></div>';

      const form =
        '<div class="surface-card rounded-2xl border p-6"><h2 class="text-lg font-semibold text-heading">' + t('contact.formTitle') + '</h2>' +
        '<form data-contact class="mt-5 space-y-4">' +
        '<div><label class="mb-1.5 block text-sm font-medium text-heading">' + t('contact.name') + '</label><input name="name" required placeholder="João Silva" class="' + field + '"/></div>' +
        '<div><label class="mb-1.5 block text-sm font-medium text-heading">' + t('contact.email') + '</label><input name="email" type="email" required placeholder="joao@email.com" class="' + field + '"/></div>' +
        '<div><label class="mb-1.5 block text-sm font-medium text-heading">' + t('contact.message') + '</label><textarea name="message" rows="5" required class="w-full rounded-lg border border-themed bg-card-bg px-3.5 py-2.5 text-sm text-body focus-ring surface-card"></textarea></div>' +
        '<button type="submit" class="flex h-11 w-full items-center justify-center gap-2 rounded-lg bg-brand-500 text-sm font-medium text-white transition hover:bg-brand-600">' + icon('mail', { size: 16 }) + ' ' + t('contact.send') + '</button>' +
        '</form></div>';

      document.getElementById('tx-main').innerHTML =
        '<div class="mx-auto max-w-7xl px-4 py-12 sm:px-6 lg:px-8">' +
        '<div class="text-center"><h1 class="text-2xl font-bold text-heading sm:text-3xl">' + t('contact.title') + '</h1><p class="mt-2 text-muted">' + t('contact.subtitle') + '</p></div>' +
        '<div class="mt-10 grid gap-8 lg:grid-cols-[1fr_1.2fr]">' + info + form + '</div></div>';

      const cf = document.querySelector('[data-contact]');
      if (cf) cf.addEventListener('submit', function (e) {
        e.preventDefault();
        UI.notify(t('contact.success'), 'success');
        cf.reset();
      });
    };
  </script>
  <script src="assets/js/layout.js"></script>
</body>
</html>
