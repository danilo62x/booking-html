<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>Agendamento — Serviços &amp; Horários</title>
  <link rel="stylesheet" href="assets/css/tailwind.css" />
  <script src="assets/js/state.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/bk.js"></script>
  <script src="assets/js/query.js"></script>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/i18n.js"></script>
</head>
<body data-shell="blank">
  <div id="app"><div id="page"></div></div>

  <script>
    window.renderPage = function () {
      const t = UI.t, icon = UI.icon;
      const isAuth = Auth.isAuthenticated();
      const dashLink = isAuth
        ? '<a href="app.html" class="flex h-11 items-center gap-2 rounded-lg border border-themed px-5 text-sm font-medium text-body transition hover:bg-gray-50 dark:hover:bg-gray-800">' + icon('dashboard', { size: 18 }) + ' ' + t('notFound.dashboard') + '</a>'
        : '';
      document.getElementById('page').innerHTML =
        '<div class="flex min-h-screen flex-col items-center justify-center px-4 text-center" style="background-color:var(--tx-body-bg)">' +
        '<p class="text-7xl font-bold text-brand-500">404</p>' +
        '<h1 class="mt-4 text-2xl font-bold text-heading">' + t('notFound.title') + '</h1>' +
        '<p class="mt-2 max-w-md text-muted">' + t('notFound.desc') + '</p>' +
        '<div class="mt-8 flex flex-wrap items-center justify-center gap-3"><a href="index.html" class="flex h-11 items-center gap-2 rounded-lg bg-brand-500 px-5 text-sm font-medium text-white transition hover:bg-brand-600">' + icon('home', { size: 18 }) + ' ' + t('notFound.home') + '</a>' + dashLink + '</div></div>';
    };
  </script>
  <script src="assets/js/layout.js"></script>
</body>
</html>
