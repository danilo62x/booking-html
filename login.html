<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>Agendamento — Serviços &amp; Horários</title>
  <link rel="stylesheet" href="assets/css/tailwind.css" />
  <script src="assets/js/state.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/bk.js"></script>
  <script src="assets/js/query.js"></script>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/i18n.js"></script>
</head>
<body data-shell="blank">
  <div id="app"><div id="page"></div></div>

  <script>
    function authShell(title, subtitle, inner, footer) {
      const icon = UI.icon, t = UI.t;
      return (
        '<div class="relative flex min-h-screen items-center justify-center bg-gradient-to-br from-brand-50 via-white to-brand-100 px-4 py-10 dark:from-gray-900 dark:via-gray-dark dark:to-gray-900">' +
        '<div class="absolute inset-0 -z-10 overflow-hidden"><div class="absolute -top-32 -right-32 h-96 w-96 rounded-full bg-brand-200/40 blur-3xl dark:bg-brand-500/10"></div><div class="absolute -bottom-32 -left-32 h-96 w-96 rounded-full bg-warning-100/60 blur-3xl dark:bg-brand-700/10"></div></div>' +
        '<div class="w-full max-w-md"><div class="mb-6 flex flex-col items-center"><a href="index.html" class="flex h-14 w-14 items-center justify-center rounded-2xl bg-brand-500 text-white shadow-theme-md">' + icon('calendar', { size: 26 }) + '</a><h1 class="mt-5 text-title-sm font-bold text-heading">' + title + '</h1><p class="mt-2 text-center text-sm text-muted">' + subtitle + '</p></div>' +
        '<div class="surface-card rounded-2xl border p-6 shadow-theme-md md:p-8">' + inner + '</div>' +
        (footer ? '<p class="mt-6 text-center text-sm text-muted">' + footer + '</p>' : '') +
        '<p class="mt-6 text-center text-xs text-muted"><a href="index.html" class="hover:text-brand-500">← ' + t('brand') + '</a></p></div></div>'
      );
    }
    window.authShell = authShell;

    window.renderPage = function () {
      const t = UI.t, icon = UI.icon, demo = Auth.DEMO_CREDENTIALS;
      const field = 'h-11 w-full rounded-lg border border-themed bg-gray-50 text-sm text-body outline-none focus:border-brand-300 focus-ring dark:bg-gray-900';

      const inner =
        '<form data-login class="space-y-5">' +
        '<div><label class="mb-2 block text-sm font-medium text-heading">' + t('auth.email') + '</label><div class="relative"><span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">' + icon('mail', { size: 18 }) + '</span><input name="email" type="email" required value="' + demo.email + '" placeholder="admin@agenda.com" class="' + field + ' pl-10 pr-3"/></div></div>' +
        '<div><label class="mb-2 block text-sm font-medium text-heading">' + t('auth.password') + '</label><div class="relative"><span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">' + icon('lock', { size: 18 }) + '</span><input name="password" type="password" required value="' + demo.password + '" placeholder="••••••••" class="' + field + ' pl-10 pr-10"/><button type="button" data-toggle-pw class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">' + icon('eye', { size: 18 }) + '</button></div></div>' +
        '<div class="flex items-center justify-between text-sm"><label class="flex items-center gap-2 text-body"><input type="checkbox" checked class="h-4 w-4 rounded border-themed accent-brand-500"/>' + t('auth.remember') + '</label><a href="esqueci-senha.html" class="font-medium text-brand-500 hover:text-brand-600">' + t('auth.forgot') + '</a></div>' +
        '<button type="submit" data-submit class="flex h-11 w-full items-center justify-center rounded-lg bg-brand-500 text-sm font-medium text-white shadow-theme-xs transition hover:bg-brand-600 focus-ring disabled:cursor-not-allowed disabled:opacity-60">' + t('auth.loginCta') + '</button>' +
        '<p data-error class="hidden rounded-lg bg-error-50 px-4 py-2 text-center text-sm text-error-600 dark:bg-error-500/15 dark:text-error-500"></p>' +
        '</form>' +
        '<div class="mt-6 rounded-lg border border-dashed border-themed bg-gray-50/60 p-3 text-xs text-muted dark:bg-gray-900/40"><p class="font-medium text-body">' + t('auth.demoTitle') + '</p><p>' + demo.email + ' / ' + demo.password + '</p><p class="mt-0.5">' + t('auth.demoHint') + '</p></div>';

      const footer = t('auth.noAccount') + ' <a href="registro.html" class="font-medium text-brand-500 hover:text-brand-600">' + t('auth.registerCta') + '</a>';
      document.getElementById('page').innerHTML = authShell(t('auth.loginTitle'), t('auth.loginSubtitle'), inner, footer);

      const form = document.querySelector('[data-login]');
      form.querySelector('[data-toggle-pw]').addEventListener('click', function () {
        const pw = form.password;
        const show = pw.type === 'password';
        pw.type = show ? 'text' : 'password';
        this.innerHTML = icon(show ? 'eye-off' : 'eye', { size: 18 });
      });
      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        const btn = form.querySelector('[data-submit]');
        const err = form.querySelector('[data-error]');
        err.classList.add('hidden');
        btn.disabled = true;
        btn.innerHTML = '<span class="flex items-center gap-2"><span class="h-4 w-4 animate-spin rounded-full border-2 border-white/30 border-t-white"></span>' + t('auth.loggingIn') + '</span>';
        const ok = await Auth.login(form.email.value, form.password.value);
        btn.disabled = false;
        btn.textContent = t('auth.loginCta');
        if (!ok) { err.textContent = t('auth.loginError'); err.classList.remove('hidden'); return; }
        UI.notify(t('auth.loginSuccess'), 'success');
        const params = new URLSearchParams(window.location.search);
        window.location.href = params.get('redirect') || 'app.html';
      });
    };
  </script>
  <script src="assets/js/layout.js"></script>
</body>
</html>
